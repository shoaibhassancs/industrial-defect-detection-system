[project]
name = "backend"
version = "0.0.0"
description = "DefectLens API: serves verified PatchCore artifacts (Release 1, stateless)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "defect-core",
    # The web stack (PLAN.md section 3 and Phase 5; approved by the owner 2026-11-10). Exact
    # versions are pinned by uv.lock.
    "fastapi",
    "uvicorn",
    "pydantic-settings",  # settings from the environment; brings pydantic
    "python-multipart",   # multipart upload parsing for FastAPI's UploadFile
    "structlog",          # JSON logs
    "slowapi",            # rate limiting (uses the `limits` package)
    # Imported directly by the backend's own code (settings, schemas, error handlers, client
    # addresses); declared here, not left to arrive through fastapi and slowapi.
    "pydantic",
    "starlette",
    "limits",
    # Imported directly by the backend's own code; declared here, not left to arrive through
    # defect-core.
    "numpy",
    "pillow",
    "torch",
]

[tool.uv.sources]
defect-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
