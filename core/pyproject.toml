[project]
name = "defect-core"
version = "0.0.0"
description = "Shared logic for DefectLens: preprocessing, PatchCore model wrapper, calibration, rendering."
requires-python = ">=3.12,<3.13"
dependencies = [
    # anomalib does not install torch by default; the "cpu" extra pulls in torch and torchvision.
    "anomalib[cpu]>=2.7.0",
    # Imported directly by defect_core's own code (preprocessing.py, model.py, artifacts.py). Declared here, not left to
    # arrive through anomalib. The exact versions are pinned by uv.lock.
    "numpy",
    "torch",
    "torchvision",
    "pillow",
    "safetensors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_core"]
