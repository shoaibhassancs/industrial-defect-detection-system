# Phase 2 step 5: fit PatchCore on the bottle `fit` split. Run from the repository root:
#   uv run python -m defect_ml.fit ml/configs/bottle_resnet18.yaml
# The weight tag is pinned in the backbone name (torchvision ImageNet weights, as in the PatchCore
# paper). An untagged name is refused. These are Phase 2 fitting settings, not the frozen Phase 3
# configuration; the `calibration` section below is that frozen Phase 3 step 1 part (fixed
# 2026-11-10, before any test access; the fit itself does not use it).
run_name: bottle_resnet18_tv_in1k_fit-v0
category: bottle
model:
  backbone: resnet18.tv_in1k
  layers: [layer2, layer3]
  num_neighbors: 9
  coreset_ratio: 0.1
weights:
  pretrained: true
fit:
  seed: 0
  batch_size: 4
  torch_threads: 4
paths:
  data_dir: data/raw/mvtec-ad
  split_dir: splits
  manifest: data/data_manifest.json
  artifact_dir: artifacts
  record_dir: experiments
guard:
  max_swap_used_mb: 5000
  min_free_disk_gib: 7
calibration:
  alpha: 0.05                 # false-alarm level; with 42 calibration images, bound 2/43
  lower_percentile: 1         # heatmap lower limit: 1st percentile of calibration pixels
  highlight_percentile: 99.5  # outline / area fraction level (display aid, not the verdict)
  upper_multiple: 1.5         # heatmap upper limit = 1.5 x the highlight level
  upper_multiple_status: unvalidated display choice; never tune on test images
