[project]
name = "defect-ml"
version = "0.0.0"
description = "DefectLens training and evaluation tooling: MVTec data access, fitting, calibration, sealed evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "defect-core",
    # Imported directly by defect_ml's own code (data/mvtec.py). The exact version is pinned by uv.lock.
    "torch",
    # Imported directly by defect_ml's own code (fit.py: settings file and pretrained-weight records).
    "pyyaml",
    "timm",
    "huggingface-hub",
    "safetensors",
]

[tool.uv.sources]
defect-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_ml"]
