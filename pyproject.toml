# Root of the uv workspace (virtual root: no project of its own).
# Members are added only when they are first needed: core/, ml/ (since Phase 2 step 5 groundwork), backend/ (since Phase 5).
[tool.uv.workspace]
members = ["core", "ml", "backend"]

# Groups installed by default, so `uv sync --all-packages` (make setup, CI) includes both.
[tool.uv]
default-groups = ["dev", "scripts"]

[dependency-groups]
# Development-only tools (not part of the application).
dev = [
    "ruff",
    "pytest",
    "httpx",  # used by FastAPI's TestClient in backend/tests
]
# Packages imported DIRECTLY by the repository's scripts/ and tests (feasibility experiments,
# dataset tools, tests). Declared here instead of relying on them arriving through anomalib.
# When defect_core's or defect_ml's own code imports one of them, declare it in that package's
# pyproject.toml too.
scripts = [
    "numpy",
    "pillow",
    "scipy",
    "matplotlib",
    "safetensors",
    "torch",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings, F: pyflakes (unused/undefined names),
# I: import sorting, UP: modernise syntax, B: likely bugs.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "ml/tests", "backend/tests", "scripts/data/tests", "scripts/tests"]
addopts = "-ra"
